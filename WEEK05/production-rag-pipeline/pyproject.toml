[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hyejin Lee", email = "wlslsue@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-rag-pipeline = "production_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"